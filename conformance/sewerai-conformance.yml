regulatory_regime:
  applicable: false
  note: >-
    Municipal wastewater condition assessment has no data-sharing regime of the kind scoring.yml
    models for banking, health, payments, telecom or energy. The operative standard for this market
    is NASSCO PACP/MACP/LACP, recorded above as the domain standard. US utilities using this data
    for CMOM and consent-decree reporting are regulated under the Clean Water Act, but that
    obligation falls on the utility, not on the software vendor's API.

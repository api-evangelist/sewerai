note: >-
  Assertions are graded against what SewerAI's own contract and public pages state. `conforms: false`
  means the standard is not in evidence, not that SewerAI claims and fails it.
domain_standard:
  id: nassco-pacp
  name: NASSCO PACP / MACP / LACP
  body: National Association of Sewer Service Companies (NASSCO)
  market: sewer condition assessment and inspection data exchange
  conforms: true
  confidence: high
  claim: >-
    "NASSCO-Certified Software for PACP LACP MACP import and export."
  claim_source: https://www.sewerai.com/products/integrations
  contract_evidence:
  - location: definitions.ObservationWrite
    file: openapi/sewerai-swagger.json
    fields:
    - Distance
    - code
    - Continuous
    - Joint
    - Clock_At_From
    - Clock_To
    - Value_1st_Dimension
    - Value_2nd_Dimension
    - Value_Percent
    - Remarks
    note: >-
      This is the PACP defect-coding record verbatim — observation code, chainage distance,
      continuous-defect linkage, joint flag, clock positions from/to, first and second dimension
      values, percentage value and remarks. An integrator that already speaks PACP reads this
      payload with no bespoke mapping.
  - location: definitions.InspectionRatings
    file: openapi/sewerai-swagger.json
    fields:
    - ST1..ST5
    - OM1..OM5
    - STGradeScore1..5
    - OMGradeScore1..5
    note: >-
      The PACP Structural (ST) and Operations & Maintenance (OM) grade and grade-score arrays that
      make up a PACP pipe rating.
  - location: inspection header schemas
    file: openapi/sewerai-swagger.json
    fields:
    - PACPQuickRating
    - MACPQuickRating
    - OverallQuickRating
    - LoFPACP
    - LoFMACP
    - PACPInspectionID
    - OverallMHRatingsIndex
    - Down_Rim_to_Grade
    - Lateral_Segment_Reference
    note: >-
      PACP and MACP quick ratings, likelihood-of-failure indices and the PACP inspection identifier
      are first-class contract fields.
  - location: definitions.*.state enum (video processing state)
    file: openapi/sewerai-swagger.json
    values:
    - nassco_review_pending
    - nassco_review_in_progress
    - nassco_review_qc_pending
    - prescreen_autocode_rejected_pending
    note: The NASSCO review stage is modelled directly into the video lifecycle state machine.
  - location: account settings
    file: openapi/sewerai-swagger.json
    fields:
    - default_pacp_project_spec_sid
    - default_macp_project_spec_sid
    note: Per-account default PACP and MACP project specifications.
  - location: asset kind enumeration
    file: openapi/sewerai-swagger.json
    values:
    - mainline
    - lateral
    - maintenance-hole
    - other
    docs: https://docs.sewerai.com/#assets_list-parameters
    note: >-
      The three asset classes map one-to-one onto the three NASSCO certification programs —
      mainline/PACP, lateral/LACP, maintenance-hole/MACP.

aid: sewerai
name: SewerAI
description: >-
  SewerAI is a Walnut Creek, California software company (founded 2019, SewerAI Corp) building AI
  computer-vision and cloud asset-management software for underground wastewater infrastructure. Its
  platform pairs PIONEER, a cloud CCTV inspection and sewer asset-management environment, with
  AutoCode, a computer-vision engine that automatically assigns NASSCO observation codes to sewer
  pipe, lateral and manhole inspection video, plus Risk & Rehab, Sewer3D, QAI and Smart Project
  Builder. It is NASSCO-certified software for PACP, LACP and MACP import and export, and sells to
  municipal utilities, engineering firms and inspection contractors. SewerAI publishes a versioned
  REST Enterprise API (v1) at api.sewerai.com for creating organizations, assets, projects,
  inspections, observations and videos, uploading inspection footage via presigned S3 posts,
  kicking off AutoCode runs, and pulling coded results and exports back into GIS, CMMS and
  work-order systems such as Esri ArcGIS, Trimble Cityworks, OpenGov Cartegraph, Lucity, Infor and
  Unearth.

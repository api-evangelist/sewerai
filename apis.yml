apis:
- name: SewerAI Enterprise API
  description: >-
    Versioned REST API (v1) for transmitting, storing and retrieving sewer asset inspection data and
    video from the SewerAI PIONEER platform, and for initiating AutoCode AI computer-vision runs and
    retrieving their coded results. Covers organizations, assets (mainline, lateral,
    maintenance-hole), projects, inspections (PACP, LACP, MACP), observations, videos with presigned
    upload, exports and users. Authenticates with an API key using the "X-SAI" Authorization prefix
    or a JWT bearer token obtained from the token endpoint. Keys are issued by SewerAI on request.
  humanURL: https://docs.sewerai.com/
  baseURL: https://api.sewerai.com/v1

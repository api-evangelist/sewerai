entries:
- date: '2026-07-14'
  title: Better data in and out of Pioneer
  summary: >-
    The public API now works in metric units and filters by customer and owner, while closer
    Cityworks and Unearth sync keeps connected systems current.
  breaking: false
  api_changes:
  - The v2 inspection and observation endpoints return converted measurements when metric units are requested.
  - Inspection and observation endpoints can be filtered by customer and owner.
  - A new endpoint exports MACP pipe connection data for downstream reporting and QA.
  integration_changes:
  - Pioneer pushes inspection archival and work-order completion back to Trimble Cityworks.
  - Cityworks connections refresh access automatically, reducing sync interruptions from expired tokens.
  - ArcGIS imports now succeed for customer portals presenting incomplete TLS certificate chains.
  - Unearth imports convert inspection statuses on the way in.
  other_highlights:
  - Custom fields 1-10 are filterable and searchable from the inspections dashboard.
  - Remarks supported on continuous NASSCO codes.
  - Accepting a digital submittal now runs QAI automatically.
  - 'Security fix: a deactivated user could still view an account''s projects.'
  - Unreviewed AutoCode observations are no longer counted in NASSCO ratings.
- date: '2026-07-01'
  title: Clearer inspection data and safer review
  summary: >-
    Custom inspection fields carry user-defined labels, videos failing automated checks stay in
    review instead of being rejected, and the v2 API adds large-export and submittal endpoints.
  breaking: false
  api_changes:
  - A new v2 endpoint exports reports with the same output as a direct report pull.
  - A new v2 endpoint returns large inspection-list CSV exports, matching the legacy list export used for PACP and Consent Decree reporting.
  - A new v2 endpoint kicks off digital submittals.
  - The v2 API can update inspection custom fields, including invoice and payment tracking values.
  - Export, download and bulk update operations in the v2 API are faster for high-volume programs.
  other_highlights:
  - The ten NASSCO custom inspection fields can be named on the project spec.
  - Videos failing automated payout/length checks stay in review; new rejection reasons Poor Quality Render and Missing Information.
  - Metric measurements round to NASSCO-allowed precision for PACP, LACP and MACP.
  - MACP inspections support standard MP4 in addition to equirectangular video.

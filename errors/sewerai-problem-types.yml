- status: 500
  code: null
  title: Internal Server Error
  body: '{"message": "Internal Server Error (500)"}'
  envelope: gateway-message
  meaning: Unhandled server error, with no correlation identifier in the body.
  remediation: >-
    Retry, then contact support with the x-amzn-requestid response header value, which is the only
    correlation identifier the API returns.

gaps:
- No 4xx or 5xx response is declared for any of the 476 operations in the published contract.
- No error-code registry, error reference page, or list of documented failure modes exists.
- >-
  403 is returned where 401 is meant, with no WWW-Authenticate header, so an agent cannot
  distinguish "not authenticated" from "authenticated but forbidden".
- No application/problem+json (RFC 9457) support.
- No error identifier is returned in any body; correlation is only possible via x-amzn-requestid.

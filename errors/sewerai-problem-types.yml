generated: '2026-08-27'
method: probed
source: >-
  live unauthenticated requests to https://api.sewerai.com/, plus openapi/sewerai-swagger.json and
  https://docs.sewerai.com/
format: json
rfc9457: false
media_type: application/json
note: >-
  SewerAI publishes NO error reference. The harvested contract declares only success responses —
  a census of all 476 operations found 302 `200`, 126 `201` and 48 `204` declarations and not one
  4xx or 5xx response object — so nothing about failure can be derived from the spec. Every entry
  below was captured from a live anonymous request against the production API on 2026-08-27 and is
  reproduced verbatim. Two different envelope shapes are in use, which is itself the finding: the
  Django application returns `{"detail": ...}` (sometimes with `code` and `messages`) or a
  field-keyed validation map, while the gateway in front of it returns `{"message": ...}`. An agent
  cannot parse SewerAI errors with a single shape.
envelopes:
- name: drf-detail
  shape: '{"detail": "<human message>"}'
  optional_fields:
  - code
  - messages
  emitted_by: the Django REST framework application
- name: drf-validation
  shape: '{"<field_name>": ["<message>", ...]}'
  emitted_by: serializer validation failures on write operations
- name: gateway-message
  shape: '{"message": "<status text> (<code>)"}'
  emitted_by: the routing layer for unmatched paths and unhandled server errors
problem_types:
- status: 403
  code: null
  title: Authentication credentials were not provided
  body: '{"detail":"Authentication credentials were not provided."}'
  envelope: drf-detail
  meaning: >-
    No credentials, or credentials the API did not recognise as a credential at all. Note that
    SewerAI answers 403 rather than 401 here, and returns no WWW-Authenticate header, so a client
    cannot discover the auth scheme from a challenge.
  remediation: >-
    Send Authorization with the X-SAI prefix and a key issued by SewerAI, or a JWT bearer obtained
    from POST /token/.
  observed:
    url: https://api.sewerai.com/v1/inspections/
    method: GET
    checked: '2026-08-27'

    - lateral
    - maintenance-hole
  notable_fields:
  - PACPInspectionID
  - Surveyed_By
  - Certificate_Number
  - Reviewed_By
  - Reviewer_Certificate_Number
  - inspection_datetime
  - autocode_complete
  - autocode_complete_date
  - Custom_Fields
  - Custom_Labels
  - IsImperial
  - ratings
  - pipe_connections
- name: InspectionRatings
  description: >-
    The NASSCO PACP/MACP rating block attached to an inspection — structural (ST) and operations &
    maintenance (OM) grade counts and grade scores, quick ratings and likelihood-of-failure indices.
  schemas:
  - InspectionRatings
  embedded_in: Inspection.ratings
  notable_fields:

  - OM1..OM5
  - STGradeScore1..5
  - OMGradeScore1..5
  - PACPQuickRating
  - MACPQuickRating
  - OverallQuickRating
  - LoFPACP
  - LoFMACP
  - OverallMHRatingsIndex
- name: Observation
  description: >-
    A single coded defect or feature found at a chainage position in an inspection. This is the PACP

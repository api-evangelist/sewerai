note: >-
  Derived from the 57 `definitions` in the harvested contract and the schema reference rendered at
  docs.sewerai.com. Relationships are read from hyperlinked reference fields — the API returns
  related resources as absolute URLs rather than bare ids, so `asset`, `owner`, `account`,
  `inspection`, `project` and `created_by` are all URI-typed foreign keys. Only entities on the
  documented v1 Enterprise surface are modelled as primary; the contract also exposes a large
  internal ML/labelling model (TrainingModel, ObservationRun, BBInferenceAssignment, ModelEnsemble,
  RegressionModel, FrameQualityReview) which is listed separately and is not part of the public API.
identifiers:
  primary_key: sid
  format: uuid
  prefixes: none
  external_key: >-
    Assets and inspections accept a caller-supplied `key` (max 128 chars) used as an external
    correlation identifier.

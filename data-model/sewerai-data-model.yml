  - renewal_year
- name: Project
  description: A body of inspection work. Inspections belong to one or more projects.
  schemas:
  - ProjectRead
  - ProjectWrite
  key: sid
- name: Inspection
  description: >-
    One survey of one asset at one point in time. The widest entity in the model — the PACP, LACP
    and MACP header record, carrying well over 150 fields covering pipe geometry, manhole
    components, coordinates, survey certification and ten NASSCO custom fields.
  schemas:
  - Inspection
  - InspectionList
  - InspectionRequest
  - PACPInspectionWriteRequest
  - MACPInspectionWriteRequest
  - LACPInspectionWriteRequest
  - MainlineInspectionWrite
  - LateralInspectionWriteRequest
  - MaintenanceHoleInspectionWriteRequest
  key: sid
  discriminator:
    field: inspection_type
    values:
